<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#440154">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Klaxon">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Klaxon &mdash; Regatta Timer</title>
</head>
<body>
  <main id="app" class="phase-idle" data-phase="idle">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="time" id="time" role="timer" aria-live="off">5:00</div>
    <div class="phase" id="phase">Ready</div>

    <div class="controls">
      <button id="primary" class="btn-primary" type="button">Start</button>
      <div class="adjust">
        <button id="minus" class="btn-secondary" type="button" aria-label="Subtract one minute">&minus;1 min</button>
        <button id="plus" class="btn-secondary" type="button" aria-label="Add one minute">+1 min</button>
      </div>
      <button id="reset" class="btn-tertiary" type="button">Reset</button>
    </div>

    <details class="settings" id="settings">
      <summary>Settings</summary>
      <fieldset>
        <legend>Sequence</legend>
        <label><input type="radio" name="seq" value="3"> 3 min</label>
        <label><input type="radio" name="seq" value="5" checked> 5 min</label>
        <label><input type="radio" name="seq" value="6"> 6 min</label>
      </fieldset>
      <label class="toggle">
        <input type="checkbox" id="sound-toggle" checked>
        <span>Beep at signals</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="shake-toggle">
        <span>Shake to sync</span>
      </label>
      <label class="slider-row" for="shake-sensitivity">
        <span class="slider-label-text">Shake threshold</span>
        <output for="shake-sensitivity" id="shake-sensitivity-out">6</output>
        <input type="range" id="shake-sensitivity" min="1" max="10" step="1" value="6">
        <span class="slider-ends"><em>easy</em><em>hard</em></span>
      </label>
      <div class="shake-meter" aria-label="Live shake strength">
        <div class="shake-meter-bar" id="meter-bar"></div>
        <div class="shake-meter-threshold" id="meter-thresh"></div>
      </div>
      <button id="calibrate" class="btn-secondary calibrate-btn" type="button">Calibrate from a hard shake</button>
      <p class="hint">Sync snaps the countdown to the nearest whole minute &mdash; tap the Sync button or shake the device when the official signal sounds.</p>
      <button id="clear-settings" class="btn-tertiary clear-btn" type="button">Clear settings</button>
    </details>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
